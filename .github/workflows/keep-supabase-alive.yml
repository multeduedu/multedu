name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar Tamanho e Formato da URL (Debug)
        run: |
          echo "Tamanho da URL: ${#SUPABASE_URL}"
          echo "URL em colchetes: [$SUPABASE_URL]"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      - name: Ping Supabase via Node.js
        run: |
          node -e "
            const url = process.env.SUPABASE_URL + '/rest/v1/keepalive?select=*&limit=1';
            console.log('Tentando acessar:', url);
            
            fetch(url, {
              headers: {
                'apikey': process.env.SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + process.env.SUPABASE_ANON_KEY
              }
            })
            .then(res => {
              console.log('Status HTTP:', res.status);
              if (!res.ok) throw new Error('Falha na API do Supabase');
              return res.json();
            })
            .then(data => console.log('Sucesso! Resposta:', JSON.stringify(data)))
            .catch(err => {
              console.error('ERRO DETALHADO:', err.message);
              process.exit(1);
            });
          "
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
